# Релиз MultiBot — только вручную: Actions → release → Run workflow,
# ветка main, версия вида v1.2.3.
# Сначала прогоняется весь CI (ci.yml), затем собирается архив (права только на чтение)
# и отдельным job публикуется релиз с тегом версии.
# Развёртывание на сервере — вручную: DEPLOY_CHECKLIST.md, раздел «Релиз из GitHub».

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например v0.1.0'
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Только из main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::Релиз запускается только из ветки main, получено: ${REF}"
            exit 1
          fi

  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Проверить версию
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Версия должна быть вида v1.2.3, получено: ${VERSION}"
            exit 1
          fi
          if out=$(gh api "repos/${GH_REPO}/git/ref/tags/${VERSION}" 2>&1); then
            echo "::error::Тег ${VERSION} уже существует"
            exit 1
          elif [[ "${out}" != *"HTTP 404"* ]]; then
            echo "::error::Не удалось проверить тег ${VERSION}: ${out}"
            exit 1
          fi
          echo "tag=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Без cache: кэш main мог быть отравлен другим workflow.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Сборка
        run: |
          set -euo pipefail
          dotnet publish src/Bot.Host -c Release -r linux-x64 --self-contained -o out/app
          (cd webapp && npm ci && npm run build)

      - name: Упаковка
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp -a out/app pkg/app
          cp -a webapp/dist pkg/webapp
          printf '%s\n' "${GITHUB_SHA}" > pkg/COMMIT
          test -x pkg/app/Bot.Host
          test -f pkg/webapp/index.html
          tar -C pkg -czf multibot.tar.gz app webapp COMMIT
          sha256sum multibot.tar.gz > multibot.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: multibot-release
          path: |
            multibot.tar.gz
            multibot.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write   # создать релиз и тег
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: multibot-release

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # gh release create с существующим тегом не падает и игнорирует --target — проверяем сами.
          if out=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" 2>&1); then
            echo "::error::Тег ${TAG} уже существует"
            exit 1
          elif [[ "${out}" != *"HTTP 404"* ]]; then
            echo "::error::Не удалось проверить тег ${TAG}: ${out}"
            exit 1
          fi
          gh release create "${TAG}" multibot.tar.gz multibot.tar.gz.sha256 \
            --target "${GITHUB_SHA}" --title "${TAG}" \
            --generate-notes --latest

      - name: Удалить архивы старых релизов (оставить 15, теги не трогаем)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[15:][] | .tagName' \
          | xargs -r -n1 gh release delete --yes
